image:
  # Custom image built from ./fluentd/Dockerfile (includes fluent-plugin-elasticsearch).
  # Build with:  docker build -t fluentd-custom:latest ./fluentd/
  # Then load into cluster:
  #   minikube: minikube image load fluentd-custom:latest
  #   kind:     kind load docker-image fluentd-custom:latest
  repository: fluentd-custom
  tag: "latest"
  pullPolicy: Never
service:
  type: ClusterIP
  # Forward protocol (used by other fluentd agents / apps)
  port: 24224
  # HTTP input (used by the log-generator and any app that can POST JSON)
  httpPort: 9880
fluentConf: |
  # ── Sources ──────────────────────────────────────────────────────────────
  # Accept MessagePack forward protocol (port 24224)
  <source>
    @type forward
    port 24224
    bind 0.0.0.0
  </source>

  # Accept plain HTTP POST with JSON body (port 9880)
  # POST to http://fluentd:9880/<tag>  with Content-Type: application/json
  <source>
    @type http
    port 9880
    bind 0.0.0.0
    body_size_limit 32m
    keepalive_timeout 10s
  </source>

  # ── Outputs ───────────────────────────────────────────────────────────────
  <match **>
    @type copy

    # 1. Ship to Elasticsearch (logstash-style index: fluentd-YYYYMMDD)
    <store>
      @type elasticsearch
      host elasticsearch
      port 9200
      logstash_format true
      logstash_prefix fluentd
      logstash_dateformat %Y%m%d
      include_tag_key true
      suppress_type_name true
      tag_key @log_name
      <buffer>
        flush_interval 1s
      </buffer>
    </store>

    # 2. Echo to stdout so kubectl logs shows activity
    <store>
      @type stdout
    </store>
  </match>

  # Suppress fluentd-internal deprecation noise
  <label @FLUENT_LOG>
    <match **>
      @type stdout
    </match>
  </label>

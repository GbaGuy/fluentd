{{- if .Values.kibana.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-ingress
  labels:
    app.kubernetes.io/name: {{ include "ingress.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Support both old and new ingress class annotation style
    kubernetes.io/ingress.class: {{ .Values.ingressClassName | quote }}
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    - host: {{ .Values.kibana.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.kibana.serviceName }}
                port:
                  number: {{ .Values.kibana.servicePort }}
{{- end }}

